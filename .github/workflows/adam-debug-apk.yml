name: Build ADAM debug APK

on:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - ".github/workflows/adam-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ADAM-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view adam-latest >/dev/null 2>&1 || gh release create adam-latest --title "ADAM Latest APK" --notes "Latest automatically built ADAM Android APK."
          gh release upload adam-latest android/app/build/outputs/apk/debug/app-debug.apk --clobber
