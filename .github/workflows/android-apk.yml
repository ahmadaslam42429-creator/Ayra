name: Build AYRA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: ayra-android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AYRA-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish installable APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view ayra-latest >/dev/null 2>&1; then
            gh release create ayra-latest --title "AYRA Android APK" --notes "Latest installable AYRA Android debug APK. Download app-debug.apk."
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk AYRA.apk
          gh release upload ayra-latest AYRA.apk --clobber
