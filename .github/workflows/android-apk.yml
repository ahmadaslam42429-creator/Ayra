name: Build AYRA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download CC0 3D avatar
        run: |
          mkdir -p android/app/src/main/assets/models
          curl -fL --retry 3 "https://vtubeme.com/media/free/cc0/blue-pixie/blue-pixie.vrm" -o android/app/src/main/assets/models/blue-pixie.vrm
          test "$(stat -c%s android/app/src/main/assets/models/blue-pixie.vrm)" -gt 1000000
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AYRA-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
