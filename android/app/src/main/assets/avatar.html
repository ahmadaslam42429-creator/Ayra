<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b18;color:#70faff;font-family:Arial,sans-serif}#stage{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 43%,#12365b 0%,#091a31 42%,#050b18 78%)}#holo{width:100%;height:100%;display:block}.hud{position:absolute;inset:0;pointer-events:none}.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0px,transparent 5px,#5ceeff0b 6px);mix-blend-mode:screen}.status{position:absolute;left:0;right:0;bottom:9px;text-align:center;font-size:11px;letter-spacing:3px;font-weight:700;color:#62fff0;text-shadow:0 0 12px #1cf5ff}.status:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#56ffe9;box-shadow:0 0 10px #56ffe9;margin:0 9px 1px 0;animation:pulse 1.4s infinite}.status.thinking:before{background:#c18bff;box-shadow:0 0 10px #c18bff}.status.talking:before{background:#ffe36a;box-shadow:0 0 10px #ffe36a}@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}.corner{position:absolute;width:25px;height:25px;border-color:#4cefff88}.tl{top:8px;left:8px;border-top:1px solid;border-left:1px solid}.tr{top:8px;right:8px;border-top:1px solid;border-right:1px solid}.bl{bottom:8px;left:8px;border-bottom:1px solid;border-left:1px solid}.br{bottom:8px;right:8px;border-bottom:1px solid;border-right:1px solid}
</style></head><body><div id="stage"><canvas id="holo"></canvas><div class="hud"><div class="scan"></div><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><div id="status" class="status">SYSTEM READY</div></div></div><script>
(()=>{const canvas=document.getElementById('holo'),ctx=canvas.getContext('2d'),status=document.getElementById('status');let W=0,H=0,dpr=1,t=0,talking=false,listening=false,thinking=false,blink=0,nextBlink=2.5;
window.setState=(l,th,ta)=>{listening=!!l;thinking=!!th;talking=!!ta;status.className='status'+(talking?' talking':thinking?' thinking':'');status.textContent=talking?'RESPONDING':thinking?'PROCESSING':listening?'LISTENING':'SYSTEM READY'};window.setTalking=v=>window.setState(listening,thinking,!!v);
function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(canvas);resize();
const particles=Array.from({length:65},()=>({x:Math.random(),y:Math.random(),z:Math.random(),s:.5+Math.random()*1.5,p:Math.random()*6.28}));
function project(x,y,z,rot,tilt,cx,cy,scale){let X=x*Math.cos(rot)+z*Math.sin(rot),Z=-x*Math.sin(rot)+z*Math.cos(rot),Y=y*Math.cos(tilt)-Z*Math.sin(tilt);Z=y*Math.sin(tilt)+Z*Math.cos(tilt);let k=3.8/(3.8-Z);return{x:cx+X*scale*k,y:cy-Y*scale*k,z:Z,k}}
function facePoint(u,v){let y=v*1.23,wide=Math.sqrt(Math.max(.001,1-v*v))*(.72-.10*v),z=Math.sqrt(Math.max(.001,1-v*v))*Math.sqrt(Math.max(.02,1-u*u))*.64;return[u*wide,y,z]}
function path(points,rot,tilt,cx,cy,scale){ctx.beginPath();points.forEach((p,i)=>{let q=project(p[0],p[1],p[2],rot,tilt,cx,cy,scale);if(i)ctx.lineTo(q.x,q.y);else ctx.moveTo(q.x,q.y)});ctx.stroke()}
function draw(now){requestAnimationFrame(draw);let dt=Math.min(.04,(now-(draw.last||now))/1000);draw.last=now;t+=dt;ctx.clearRect(0,0,W,H);let cx=W*.5,cy=H*.46,scale=Math.min(W*.39,H*.40),rot=Math.sin(t*.32)*.13+Math.sin(t*.11)*.07+(listening?Math.sin(t*1.8)*.09:0),tilt=Math.sin(t*.7)*.025,bob=Math.sin(t*1.7)*.025;
let glow=ctx.createRadialGradient(cx,cy,scale*.08,cx,cy,scale*1.2);glow.addColorStop(0,'#12dfff24');glow.addColorStop(1,'#07142a00');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
particles.forEach(p=>{let x=(p.x*W+Math.sin(t*.25+p.p)*8)%W,y=(p.y*H-t*(8+p.z*8)+H)%H;ctx.fillStyle='#72faff';ctx.globalAlpha=.18+.28*(.5+.5*Math.sin(t*2+p.p));ctx.fillRect(x,y,p.s,p.s)});ctx.globalAlpha=1;
ctx.save();ctx.strokeStyle='#38dfff55';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(cx,cy+scale*.76,scale*.72,scale*.13,Math.sin(t*.4)*.08,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(cx,cy+scale*.76,scale*.54,scale*.095,0,0,Math.PI*2);ctx.stroke();ctx.restore();
ctx.save();ctx.lineWidth=.75;ctx.strokeStyle='#42dfff9a';ctx.shadowColor='#13cfff';ctx.shadowBlur=7;
for(let j=0;j<=18;j++){let v=-.96+j*.106,pts=[];for(let i=0;i<=48;i++)pts.push(facePoint(-.99+i*.04125,v));let started=false;ctx.beginPath();for(const p of pts){let q=project(p[0],p[1],p[2],rot,tilt,cx,cy+bob*scale,scale);if(q.z>-.08){if(!started){ctx.moveTo(q.x,q.y);started=true}else ctx.lineTo(q.x,q.y)}else started=false}ctx.stroke()}
for(let i=0;i<=24;i++){let u=-.98+i*.0817,pts=[];for(let j=0;j<=38;j++)pts.push(facePoint(u,-.98+j*.0516));let started=false;ctx.beginPath();for(const p of pts){let q=project(p[0],p[1],p[2],rot,tilt,cx,cy+bob*scale,scale);if(q.z>-.04){if(!started){ctx.moveTo(q.x,q.y);started=true}else ctx.lineTo(q.x,q.y)}else started=false}ctx.stroke()}ctx.restore();
function feature(points,color='#8affff',width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.shadowColor=color;ctx.shadowBlur=9;path(points,rot,tilt,cx,cy+bob*scale,scale)}
let eyeY=.16,blinkNow=blink>0?Math.max(.08,Math.abs(Math.sin(blink*Math.PI))):1;
for(const side of [-1,1]){let x=side*.31;feature([[x-.14,eyeY,.55],[x-.07,eyeY+.045*blinkNow,.60],[x,eyeY+.055*blinkNow,.615],[x+.07,eyeY+.045*blinkNow,.60],[x+.14,eyeY,.55]],'#70ffff',2.2);feature([[x-.13,eyeY+.12,.53],[x,eyeY+.15,.58],[x+.13,eyeY+.12,.53]],'#3dbde9',1.2);let e=project(x,eyeY,.62,rot,tilt,cx,cy+bob*scale,scale);ctx.fillStyle='#baffff';ctx.shadowColor='#42faff';ctx.shadowBlur=12;ctx.beginPath();ctx.ellipse(e.x,e.y,Math.max(1,scale*.025),Math.max(1,scale*.025*blinkNow),0,0,Math.PI*2);ctx.fill()}
feature([[0,.13,.62],[0,-.04,.69],[-.045,-.12,.64],[0,-.16,.67],[.045,-.12,.64]],'#61eaff',1.6);feature([[-.09,-.18,.59],[-.04,-.20,.63],[0,-.19,.65],[.04,-.20,.63],[.09,-.18,.59]],'#4bcce9',1.2);
let open=talking?(.025+Math.abs(Math.sin(t*11))*.10):.012;feature([[-.19,-.34,.53],[-.10,-.33+open,.60],[0,-.34+open*1.15,.62],[.10,-.33+open,.60],[.19,-.34,.53]],'#8cffff',2);feature([[-.18,-.35,.53],[-.09,-.36-open*.55,.60],[0,-.37-open*.65,.62],[.09,-.36-open*.55,.60],[.18,-.35,.53]],'#42dfff',1.3);
feature([[-.48,-.42,.35],[-.35,-.72,.26],[0,-.82,.30],[.35,-.72,.26],[.48,-.42,.35]],'#35cde9',1.1);feature([[-.31,-.76,.20],[-.28,-1.05,.18],[0,-1.12,.24],[.28,-1.05,.18],[.31,-.76,.20]],'#3bdcf1',1.3);
let sy=((t*.22)%1)*H,beam=ctx.createLinearGradient(0,sy-12,0,sy+12);beam.addColorStop(0,'#38eaff00');beam.addColorStop(.5,'#38eaff22');beam.addColorStop(1,'#38eaff00');ctx.fillStyle=beam;ctx.fillRect(0,sy-12,W,24);
if(now/1000>nextBlink){blink=1;nextBlink=now/1000+2.2+Math.random()*3}if(blink>0)blink-=dt*3.8}
requestAnimationFrame(draw)})();
</script></body></html>
